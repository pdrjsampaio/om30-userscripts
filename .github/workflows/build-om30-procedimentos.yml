name: Build OM30 Procedimentos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-om30-procedimentos.yml'
      - 'om30-scripts/procedimentos/app.part*.b64'
      - 'om30-scripts/procedimentos/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild app.js and validate hash
        shell: bash
        run: |
          set -euo pipefail
          cd om30-scripts/procedimentos
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, re, sys

          parts = sorted(Path('.').glob('app.part*.b64'))
          if not parts:
              raise SystemExit('Nenhuma parte encontrada')

          cleaned_parts = []
          print('Partes encontradas:', len(parts))
          for p in parts:
              raw = p.read_text(encoding='utf-8', errors='ignore')
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              cleaned_parts.append(clean)
              print(f'{p.name}: raw={len(raw)} clean={len(clean)} eq={clean.count("=")} ini={clean[:8]} fim={clean[-8:]}')

          data = ''.join(cleaned_parts)
          # padding somente no final
          data = data.rstrip('=')
          data += '=' * ((4 - len(data) % 4) % 4)

          try:
              packed = base64.b64decode(data, validate=True)
          except Exception as e:
              raise SystemExit(f'Base64 inválido após limpeza: {e}')

          try:
              app = gzip.decompress(packed)
          except Exception as e:
              raise SystemExit(f'Gzip inválido: {e}')

          Path('app.js').write_bytes(app)

          actual = hashlib.sha256(app).hexdigest()
          expected = json.loads(Path('manifest.json').read_text(encoding='utf-8'))['sha256']
          print('Actual:  ', actual)
          print('Expected:', expected)
          if actual != expected:
              raise SystemExit('SHA-256 não confere; app.js NÃO será publicado')
          PY
          node --check app.js

      - name: Publish app.js
        shell: bash
        run: |
          if git diff --quiet -- om30-scripts/procedimentos/app.js; then
            echo 'app.js already up to date.'
            exit 0
          fi
          git config user.name 'OM30 Bot'
          git config user.email 'om30-bot@users.noreply.github.com'
          git add om30-scripts/procedimentos/app.js
          git commit -m 'build: publicar OM30 Procedimentos app.js'
          git push
