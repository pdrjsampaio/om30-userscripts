name: Build OM30 Procedimentos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-om30-procedimentos.yml'
      - 'om30-scripts/procedimentos/app.part*.b64'
      - 'om30-scripts/procedimentos/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild app.js and validate hash
        shell: bash
        run: |
          set -euo pipefail
          cd om30-scripts/procedimentos
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, re, zlib

          parts = sorted(Path('.').glob('app.part*.b64'))
          clean_parts = []
          for p in parts:
              raw = p.read_text(encoding='utf-8', errors='ignore')
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
              clean_parts.append(clean)
              print(f'{p.name}: {len(clean)} chars | ini={clean[:8]} | fim={clean[-8:]}')

          data = ''.join(clean_parts).rstrip('=')
          expected = json.loads(Path('manifest.json').read_text(encoding='utf-8'))['sha256']
          print('Total base64 chars:', len(data), 'mod4=', len(data) % 4)

          def decode_candidate(candidate):
              padded = candidate + '=' * ((4 - len(candidate) % 4) % 4)
              try:
                  packed = base64.b64decode(padded, validate=True)
                  app = gzip.decompress(packed)
                  return app
              except Exception:
                  return None

          def valid(candidate, label):
              app = decode_candidate(candidate)
              if app is None:
                  return None
              actual = hashlib.sha256(app).hexdigest()
              print('GZIP válido:', label, 'sha=', actual)
              return app if actual == expected else None

          app = valid(data, 'sem reparo')

          if app is None and len(data) % 4 == 1:
              # Remove provisoriamente o último char apenas para tornar o Base64 decodificável
              probe = data[:-1]
              packed = base64.b64decode(probe + '=' * ((4-len(probe)%4)%4), validate=True)
              d = zlib.decompressobj(31)
              fail_at = None
              out_len = 0
              step = 256
              for off in range(0, len(packed), step):
                  chunk = packed[off:off+step]
                  try:
                      out_len += len(d.decompress(chunk))
                  except zlib.error as e:
                      fail_at = off
                      print('Falha gzip aproximada em compressed byte', off, '| saída parcial', out_len, '|', e)
                      break

              if fail_at is None:
                  fail_at = max(0, len(packed)-step)

              estimate = int(fail_at * 4 / 3)
              print('Posição Base64 estimada:', estimate)

              # Busca progressiva ao redor do ponto onde o gzip deixou de ser válido.
              searched = set()
              for radius in (256, 1024, 4096, 12000):
                  lo = max(0, estimate-radius)
                  hi = min(len(data), estimate+radius+1)
                  print('Buscando remoção em', lo, '..', hi-1)
                  for pos in range(lo, hi):
                      if pos in searched:
                          continue
                      searched.add(pos)
                      candidate = data[:pos] + data[pos+1:]
                      result = valid(candidate, f'remove pos {pos}')
                      if result is not None:
                          app = result
                          print('REPARO ENCONTRADO na posição', pos, 'char=', data[pos])
                          break
                  if app is not None:
                      break

          if app is None:
              raise SystemExit('Não foi possível reconstruir um app com o SHA esperado.')

          Path('app.js').write_bytes(app)
          print('SHA VALIDADO:', expected)
          PY
          node --check app.js

      - name: Publish app.js
        shell: bash
        run: |
          if git diff --quiet -- om30-scripts/procedimentos/app.js; then
            echo 'app.js already up to date.'
            exit 0
          fi
          git config user.name 'OM30 Bot'
          git config user.email 'om30-bot@users.noreply.github.com'
          git add om30-scripts/procedimentos/app.js
          git commit -m 'build: publicar OM30 Procedimentos app.js'
          git push
