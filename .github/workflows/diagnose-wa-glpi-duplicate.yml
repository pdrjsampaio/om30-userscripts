name: Diagnosticar duplicação WhatsApp GLPI

on:
  push:
    paths:
      - '.github/workflows/diagnose-wa-glpi-duplicate.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar as duas cópias
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, difflib

          p = Path('OM30-WhatsApp-GLPI.user.js')
          s = p.read_text(encoding='utf-8')
          marker = '// ==UserScript=='
          positions = []
          start = 0
          while True:
              i = s.find(marker, start)
              if i < 0:
                  break
              positions.append(i)
              start = i + len(marker)

          print('header_count=', len(positions))
          print('positions=', positions)
          print('total_chars=', len(s))
          print('total_lines=', len(s.splitlines()))

          if len(positions) != 2:
              raise SystemExit(f'Esperava 2 cabeçalhos, encontrei {len(positions)}')

          a = s[:positions[1]].rstrip() + '\n'
          b = s[positions[1]:].rstrip() + '\n'

          print('copy1_chars=', len(a), 'lines=', len(a.splitlines()), 'sha256=', hashlib.sha256(a.encode()).hexdigest())
          print('copy2_chars=', len(b), 'lines=', len(b.splitlines()), 'sha256=', hashlib.sha256(b.encode()).hexdigest())
          print('exact_equal=', a == b)

          # Normaliza só números de versão para saber se é a mesma base funcional.
          import re
          def norm(x):
              x = re.sub(r'// @version\s+\d+\.\d+\.\d+', '// @version X', x)
              x = re.sub(r"const OM30_VERSION =\s*'\d+\.\d+\.\d+';", "const OM30_VERSION = 'X';", x)
              x = re.sub(r'v\d+\.\d+\.\d+', 'vX', x)
              return x

          na, nb = norm(a), norm(b)
          print('equal_ignoring_versions=', na == nb)

          required = [
              'om30-settings-download-log',
              'collectEvidenceImages',
              'glpi.images.uploaded',
              'newprofile=6',
              'silentCompressPrintForGlpi',
              'selection_active',
          ]
          for token in required:
              print(token, 'copy1=', token in a, 'copy2=', token in b)

          if na != nb:
              diff = list(difflib.unified_diff(na.splitlines(), nb.splitlines(), fromfile='copy1', tofile='copy2', n=2))
              print('DIFF_LINES=', len(diff))
              print('\n'.join(diff[:220]))
          PY
