name: Fix Preencher v421

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-preencher-v421.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PDF worker and bump v4.21
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('OM30-Preencher-Profissional.user.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// @version      4.20', '// @version      4.21', 1)
          req = '// @require      https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js\n'
          worker_req = '// @require      https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js\n'
          if worker_req not in s:
              s = s.replace(req, req + worker_req, 1)

          old = '''  /* ---------- pdf.js worker (dribla CSP) ---------- */\n  async function prepararWorker() {\n    if (typeof pdfjsLib === 'undefined')\n      throw new Error('pdf.js NÃO carregou (a página pode bloquear o @require). Me avise.');\n    const w = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';\n    try {\n      const code = await new Promise((res, rej) => GM_xmlhttpRequest({ method:'GET', url:w,\n        onload:r=>res(r.responseText), onerror:rej, ontimeout:rej, timeout:20000 }));\n      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code],{type:'application/javascript'}));\n    } catch (e) { pdfjsLib.GlobalWorkerOptions.workerSrc = w; }\n  }\n'''
          new = '''  /* ---------- pdf.js worker ---------- */\n  // O worker também é carregado por @require. Assim a leitura do PDF não precisa\n  // baixar código via GM_xmlhttpRequest toda vez que o usuário clica em ler.\n  async function prepararWorker() {\n    if (typeof pdfjsLib === 'undefined')\n      throw new Error('PDF.js não carregou. Reinstale/atualize o script e recarregue a página.');\n\n    const w = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';\n    pdfjsLib.GlobalWorkerOptions.workerSrc = w;\n\n    if (typeof globalThis.pdfjsWorker === 'undefined') {\n      console.warn('[Preencher] pdf.worker não apareceu no sandbox; PDF.js tentará o worker pela URL.');\n    }\n  }\n'''
          if old not in s:
              raise SystemExit('Bloco prepararWorker antigo não encontrado')
          s = s.replace(old, new, 1)

          old2 = "const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;"
          new2 = """const bytes = await file.arrayBuffer();\n    const tarefaPdf = pdfjsLib.getDocument({ data: bytes });\n    const pdf = await Promise.race([\n      tarefaPdf.promise,\n      new Promise((_, reject) => setTimeout(() => reject(new Error('A leitura do PDF demorou mais de 20 segundos. Feche e abra a ficha novamente ou recarregue a página.')), 20000))\n    ]);"""
          if old2 not in s:
              raise SystemExit('Linha getDocument antiga não encontrada')
          s = s.replace(old2, new2, 1)
          s = s.replace('Ficha PDF · CNES · v4.20', 'Ficha PDF · CNES · v4.21')
          p.write_text(s, encoding='utf-8')
          PY

          node --check OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.21$' OM30-Preencher-Profissional.user.js
          grep -q 'pdf.worker.min.js' OM30-Preencher-Profissional.user.js
          grep -q 'demorou mais de 20 segundos' OM30-Preencher-Profissional.user.js

      - name: Publish v4.21
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OM30 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add OM30-Preencher-Profissional.user.js
          git commit -m 'Preencher Profissional v4.21: corrige leitura PDF e worker' || exit 0
          git push
