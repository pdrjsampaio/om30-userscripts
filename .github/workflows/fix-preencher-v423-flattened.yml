name: Fix Preencher v423 flattened

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-preencher-v423-flattened.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python3 .github/scripts/fix_preencher_v423.py

      - name: Validar
        run: |
          node --check OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.23$' OM30-Preencher-Profissional.user.js
          grep -q 'Ficha assinada/achatada detectada' OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.23$' OM30-Preencher-Profissional.meta.js

      - name: Publicar
        run: |
          rm -f .github/workflows/fix-preencher-v423-flattened.yml
          rm -f .github/scripts/fix_preencher_v423.py
          git config user.name 'OM30 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Preencher Profissional v4.23: leitura de fichas assinadas achatadas' || exit 0
          git push
