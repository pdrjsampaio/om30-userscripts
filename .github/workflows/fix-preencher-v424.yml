name: Fix Preencher v424 stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-preencher-v424.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar leitor estável e adicionar fallback assinado
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          p=Path('OM30-Preencher-Profissional.user.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('  /* ---------- pdf.js worker')
          end=s.index('  /* ---------- AcroForm -> dados ---------- */', start)
          block=base64.b64decode('').decode('utf-8')
          s=s[:start]+block+s[end:]
          s=s.replace('// @version      4.23','// @version      4.24',1)
          s=s.replace('// @require      https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js\n','',1)
          s=s.replace('// @description  Lê a Ficha de Cadastro (PDF AcroForm), preenche o profissional, deduz órgão de classe pelo CBO e consulta CNS/CNES pelo CPF. Atualização automática via GitHub.', '// @description  Lê a Ficha de Cadastro (AcroForm ou PDF assinado/achatado), preenche o profissional, deduz órgão de classe pelo CBO e consulta CNS/CNES pelo CPF.')
          s=s.replace('Ficha PDF · CNES · v4.23','Ficha PDF · CNES · v4.24')
          p.write_text(s,encoding='utf-8')
          m=Path('OM30-Preencher-Profissional.meta.js')
          ms=m.read_text(encoding='utf-8').replace('// @version      4.23','// @version      4.24',1)
          m.write_text(ms,encoding='utf-8')
          PY2
          node --check OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.24$' OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.24$' OM30-Preencher-Profissional.meta.js
          ! grep -q '^// @require .*pdf.worker.min.js' OM30-Preencher-Profissional.user.js
          grep -q 'Ficha assinada/achatada: fallback de texto utilizado' OM30-Preencher-Profissional.user.js
      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-preencher-v424.yml
          git config user.name 'OM30 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Preencher Profissional v4.24: restaura fluxo estável e corrige fichas assinadas' || exit 0
          git push
