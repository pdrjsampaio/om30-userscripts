name: Corrigir perfil GLPI WhatsApp 0.9.9

on:
  push:
    paths:
      - '.github/workflows/fix-whatsapp-glpi-profile-099.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar correção real de perfil
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('OM30-WhatsApp-GLPI.user.js')
          s = p.read_text(encoding='utf-8')

          old = '''        const shellHtml = shell.responseText || '';
        const shellFinal = shell.finalUrl || ticketUrl;

        if (silentLooksLikeLogin(shellHtml, shellFinal)) {
            return {
                authenticated: false,
                phase: 'shell',
                status: shell.status,
                rawHtml: shellHtml
            };
        }

        let parsed = silentFormFromHTML(shellHtml);
'''

          new = '''        let shellHtml = shell.responseText || '';
        let shellFinal = shell.finalUrl || ticketUrl;

        if (silentLooksLikeLogin(shellHtml, shellFinal)) {
            return {
                authenticated: false,
                phase: 'shell',
                status: shell.status,
                rawHtml: shellHtml
            };
        }

        const profileState = await silentEnsureTiAtendimentoProfile(
            shellHtml,
            readGlpiJob()
        );

        if (profileState.changed) {
            const refreshedShell = await silentRequest({
                method: 'GET',
                url:
                    `${ticketUrl}${ticketUrl.includes('?') ? '&' : '?'}` +
                    `om30_profile_ready=${Date.now()}`,
                headers: {
                    'Accept':
                        'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
                }
            });

            shellHtml = refreshedShell.responseText || '';
            shellFinal = refreshedShell.finalUrl || ticketUrl;

            if (silentLooksLikeLogin(shellHtml, shellFinal)) {
                return {
                    authenticated: false,
                    phase: 'shell-after-profile',
                    status: refreshedShell.status,
                    rawHtml: shellHtml
                };
            }

            const confirmedProfile = silentDetectCurrentProfile(shellHtml);

            om30Log('glpi.profile.after-refresh', {
                job_id: readGlpiJob()?.id || '',
                current_profile_id: confirmedProfile.id,
                current_profile: confirmedProfile.name,
                source: confirmedProfile.source
            });

            if (
                confirmedProfile.id &&
                confirmedProfile.id !== '6' &&
                glpiNormalize(confirmedProfile.name) !== 'TI ATENDIMENTO'
            ) {
                throw new Error(
                    `Perfil TI | Atendimento não permaneceu ativo após a troca. ` +
                    `Perfil atual: ${confirmedProfile.name || confirmedProfile.id}.`
                );
            }
        }

        let parsed = silentFormFromHTML(shellHtml);
'''

          if old not in s:
              raise SystemExit('ERRO: bloco alvo de silentGetTicketForm não encontrado')

          s = s.replace(old, new, 1)

          # Versão pública e versão interna/logs precisam andar juntas.
          s = s.replace('// @version      0.9.8', '// @version      0.9.9', 1)
          s = s.replace('0.9.6', '0.9.9')

          if "await silentEnsureTiAtendimentoProfile(" not in s:
              raise SystemExit('ERRO: chamada de validação de perfil não foi inserida')
          if "const OM30_VERSION =\n        '0.9.9';" not in s:
              raise SystemExit('ERRO: versão interna não foi atualizada')

          p.write_text(s, encoding='utf-8')
          PY

          node --check OM30-WhatsApp-GLPI.user.js
          grep -n "@version      0.9.9" OM30-WhatsApp-GLPI.user.js
          grep -n "await silentEnsureTiAtendimentoProfile" OM30-WhatsApp-GLPI.user.js
          grep -n "glpi.profile.after-refresh" OM30-WhatsApp-GLPI.user.js

      - name: Publicar v0.9.9
        shell: bash
        run: |
          git config user.name "pdrjsampaio"
          git config user.email "pdrjustinosampaio@gmail.com"
          git add OM30-WhatsApp-GLPI.user.js
          git commit -m "fix: garantir perfil TI Atendimento antes do formulário GLPI v0.9.9"
          git push
