name: Corrigir upload GLPI WhatsApp 0.9.12

on:
  push:
    paths:
      - '.github/workflows/fix-whatsapp-glpi-upload-0912.yml'
      - '.github/scripts/fix_whatsapp_glpi_upload_0912.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar patch
        run: python3 .github/scripts/fix_whatsapp_glpi_upload_0912.py
      - name: Validar sintaxe
        run: node --check OM30-WhatsApp-GLPI.user.js
      - name: Publicar
        run: |
          git config user.name "pdrjsampaio"
          git config user.email "pdrjustinosampaio@gmail.com"
          git add OM30-WhatsApp-GLPI.user.js
          git commit -m "fix: compactar print antes do upload GLPI v0.9.12"
          git push
