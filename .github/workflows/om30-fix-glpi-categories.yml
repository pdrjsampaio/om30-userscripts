# Reexecução após ajuste da validação da v0.9.13.
name: OM30 - Corrigir categorias GLPI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/om30-fix-glpi-categories.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patch_glpi_categories_v0914.py

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          node --check OM30-WhatsApp-GLPI.user.js
          grep -q '^// @version      0.9.14$' OM30-WhatsApp-GLPI.user.js
          grep -q "'Erro': 109" OM30-WhatsApp-GLPI.user.js
          grep -q "'Touch': 52" OM30-WhatsApp-GLPI.user.js
          grep -q "'Cadastro': 80" OM30-WhatsApp-GLPI.user.js
          grep -q "'Falha/Defeito': 22" OM30-WhatsApp-GLPI.user.js
          git diff --check

      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_glpi_categories_v0914.py .github/workflows/om30-fix-glpi-categories.yml
          git config user.name 'OM30 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: usar IDs confirmados das categorias GLPI'
          git push
