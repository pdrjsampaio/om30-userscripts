name: Corrigir perfil GLPI WhatsApp 0.9.8

on:
  push:
    paths:
      - '.github/workflows/patch-whatsapp-glpi-profile-098.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar correção de perfil
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('OM30-WhatsApp-GLPI.user.js')
          s = p.read_text(encoding='utf-8')

          if '// @version      0.9.7' not in s:
              raise SystemExit('Versão esperada 0.9.7 não encontrada.')
          s = s.replace('// @version      0.9.7', '// @version      0.9.8', 1)

          marker = '''    function silentRequest(details) {\n'''
          insert = '''    function silentDetectCurrentProfile(html) {\n        try {\n            const doc = silentParseHTML(html);\n\n            const active = [\n                ...doc.querySelectorAll('a[href*="newprofile="]')\n            ].find(a => a.classList.contains('active'));\n\n            if (active) {\n                const href = String(active.getAttribute('href') || '');\n                const id = href.match(/[?&]newprofile=(\\d+)/)?.[1] || '';\n                const name = String(active.textContent || '')\n                    .replace(/\\s+/g, ' ')\n                    .trim();\n\n                return { id, name, source: 'active-link' };\n            }\n\n            const header = doc.querySelector(\n                '.user-menu-dropdown-toggle .pe-2 > div:first-child'\n            );\n\n            const name = String(header?.textContent || '')\n                .replace(/\\s+/g, ' ')\n                .trim();\n\n            if (name) {\n                return {\n                    id: glpiNormalize(name) === 'TI ATENDIMENTO' ? '6' : '',\n                    name,\n                    source: 'user-menu'\n                };\n            }\n        } catch (error) {\n            console.warn('OM30: não consegui identificar o perfil GLPI atual.', error);\n        }\n\n        return { id: '', name: '', source: 'unknown' };\n    }\n\n    async function silentEnsureTiAtendimentoProfile(shellHtml, job) {\n        const current = silentDetectCurrentProfile(shellHtml);\n\n        om30Log('glpi.profile.check', {\n            job_id: job?.id || '',\n            current_profile_id: current.id,\n            current_profile: current.name,\n            source: current.source\n        });\n\n        if (\n            current.id === '6' ||\n            glpiNormalize(current.name) === 'TI ATENDIMENTO'\n        ) {\n            return { changed: false, profile: current };\n        }\n\n        const response = await silentRequest({\n            method: 'GET',\n            url:\n                `${GLPI_TEST.base}/front/helpdesk.public.php` +\n                `?newprofile=6&om30_profile=${Date.now()}`,\n            headers: {\n                'Accept':\n                    'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'\n            }\n        });\n\n        const html = response.responseText || '';\n\n        if (silentLooksLikeLogin(html, response.finalUrl || '')) {\n            throw new Error('LOGIN_REQUIRED');\n        }\n\n        const confirmed = silentDetectCurrentProfile(html);\n\n        if (\n            confirmed.id &&\n            confirmed.id !== '6' &&\n            glpiNormalize(confirmed.name) !== 'TI ATENDIMENTO'\n        ) {\n            throw new Error(\n                `Não foi possível ativar o perfil TI | Atendimento. ` +\n                `Perfil atual: ${confirmed.name || confirmed.id}.`\n            );\n        }\n\n        om30Log('glpi.profile.changed', {\n            job_id: job?.id || '',\n            from_profile_id: current.id,\n            from_profile: current.name,\n            to_profile_id: '6',\n            to_profile: 'TI | Atendimento'\n        });\n\n        return {\n            changed: true,\n            profile: {\n                id: '6',\n                name: 'TI | Atendimento',\n                source: 'forced'\n            }\n        };\n    }\n\n'''
          if marker not in s:
              raise SystemExit('Ponto silentRequest não encontrado.')
          if 'function silentEnsureTiAtendimentoProfile' in s:
              raise SystemExit('Correção de perfil já existe.')
          s = s.replace(marker, insert + marker, 1)

          old = '''                rawHtml: shellHtml,\n                source: 'ticket.form.php',\n                ticketUrl\n'''
          new = '''                rawHtml: shellHtml,\n                shellHtml,\n                source: 'ticket.form.php',\n                ticketUrl\n'''
          if old not in s:
              raise SystemExit('Retorno shell do ticket não encontrado.')
          s = s.replace(old, new, 1)

          old = '''            rawHtml: tabHtml,\n            source: 'common.tabs.php',\n            ticketUrl\n'''
          new = '''            rawHtml: tabHtml,\n            shellHtml,\n            source: 'common.tabs.php',\n            ticketUrl\n'''
          if old not in s:
              raise SystemExit('Retorno common.tabs não encontrado.')
          s = s.replace(old, new, 1)

          old = '''        const ctx =\n            await silentGetTicketForm(0);\n\n        if (!ctx.authenticated) {\n            silentRequireLogin(\n                job,\n                'silent-form',\n                'Faça login no GLPI para a OM30 continuar.'\n            );\n\n            return {\n                waitingLogin: true\n            };\n        }\n\n        job.stage =\n            'silent-user';\n'''
          new = '''        let ctx =\n            await silentGetTicketForm(0);\n\n        if (!ctx.authenticated) {\n            silentRequireLogin(\n                job,\n                'silent-form',\n                'Faça login no GLPI para a OM30 continuar.'\n            );\n\n            return {\n                waitingLogin: true\n            };\n        }\n\n        job.stage =\n            'silent-profile';\n\n        saveGlpiJob(job);\n\n        try {\n            const profileResult =\n                await silentEnsureTiAtendimentoProfile(\n                    ctx.shellHtml || ctx.rawHtml || '',\n                    job\n                );\n\n            if (profileResult.changed) {\n                ctx = await silentGetTicketForm(0);\n\n                if (!ctx.authenticated) {\n                    throw new Error('LOGIN_REQUIRED');\n                }\n\n                const verified = silentDetectCurrentProfile(\n                    ctx.shellHtml || ctx.rawHtml || ''\n                );\n\n                if (\n                    verified.id &&\n                    verified.id !== '6' &&\n                    glpiNormalize(verified.name) !== 'TI ATENDIMENTO'\n                ) {\n                    throw new Error(\n                        `O GLPI não permaneceu no perfil TI | Atendimento. ` +\n                        `Perfil atual: ${verified.name || verified.id}.`\n                    );\n                }\n            }\n        } catch (error) {\n            if (error?.message === 'LOGIN_REQUIRED') {\n                silentRequireLogin(\n                    job,\n                    'silent-profile',\n                    'Faça login no GLPI para a OM30 ativar o perfil TI | Atendimento.'\n                );\n\n                return { waitingLogin: true };\n            }\n\n            throw error;\n        }\n\n        job.stage =\n            'silent-user';\n'''
          if old not in s:
              raise SystemExit('Bloco silentCreateAndFixJob esperado não encontrado.')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

          node --check OM30-WhatsApp-GLPI.user.js
          grep -q '@version      0.9.8' OM30-WhatsApp-GLPI.user.js
          grep -q 'newprofile=6' OM30-WhatsApp-GLPI.user.js
          grep -q 'function silentEnsureTiAtendimentoProfile' OM30-WhatsApp-GLPI.user.js

      - name: Publicar v0.9.8
        shell: bash
        run: |
          git config user.name "pdrjsampaio"
          git config user.email "pdrjustinosampaio@gmail.com"
          git add OM30-WhatsApp-GLPI.user.js
          git commit -m "fix: garantir perfil TI Atendimento no GLPI v0.9.8"
          git push
