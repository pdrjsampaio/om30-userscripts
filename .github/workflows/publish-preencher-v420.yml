name: Publish Preencher v420

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-preencher-v420.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build single userscript
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/header.txt
          printf '\n\n' >> /tmp/header.txt
          cat /tmp/header.txt om30-scripts/preencher-profissional/OM30-Preencher-Profissional.core.js > OM30-Preencher-Profissional.user.js
          python3 -c "from pathlib import Path; p=Path('OM30-Preencher-Profissional.user.js'); s=p.read_text(encoding='utf-8'); s=s.replace('Ficha PDF · CNES · v4.17','Ficha PDF · CNES · v4.20').replace('Ficha PDF · CNES · v4.18','Ficha PDF · CNES · v4.20').replace('Ficha PDF · CNES · v4.19','Ficha PDF · CNES · v4.20'); p.write_text(s,encoding='utf-8')"
          node --check OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.20$' OM30-Preencher-Profissional.user.js
          if grep -q 'OM30-Preencher-Profissional.core.js' OM30-Preencher-Profissional.user.js; then exit 1; fi
          if grep -q 'DecompressionStream' OM30-Preencher-Profissional.user.js; then exit 1; fi

      - name: Publish and remove split core
        shell: bash
        run: |
          set -euo pipefail
          rm -f om30-scripts/preencher-profissional/OM30-Preencher-Profissional.core.js
          rmdir om30-scripts/preencher-profissional 2>/dev/null || true
          git config user.name 'OM30 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Preencher Profissional v4.20: arquivo unico sem loader' || exit 0
          git push
