name: Publish Preencher v427

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-preencher-v427.yml'
      - '.github/patch_v427.py'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correcoes v4.27
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patch_v427.py

      - name: Validar
        shell: bash
        run: |
          set -euo pipefail
          cp OM30-Preencher-Profissional.user.js /tmp/preencher-v427.js
          node --check /tmp/preencher-v427.js
          grep -q '^// @version      4.27$' OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.27$' OM30-Preencher-Profissional.meta.js
          grep -q 'nomeCboExato' OM30-Preencher-Profissional.user.js
          grep -q 'Médico Clínico.*Médico oncologista clínico' OM30-Preencher-Profissional.user.js
          grep -q 'UF conselho veio como AC/Acre' OM30-Preencher-Profissional.user.js

      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch_v427.py .github/workflows/publish-preencher-v427.yml
          git config user.name 'OM30 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Preencher Profissional v4.27: CBO exato e bloqueio de Acre indevido'
          git push
