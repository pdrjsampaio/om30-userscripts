name: Restaurar WhatsApp GLPI completo

on:
  push:
    paths:
      - '.github/workflows/restore-whatsapp-glpi-full.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruir userscript completo
        shell: bash
        run: |
          set -euo pipefail
          cat om30-scripts/whatsapp-glpi/app.part*.b64 | tr -d '\n\r\t ' | base64 -d | gzip -d > /tmp/OM30-WhatsApp-GLPI.original.user.js

          python3 - <<'PY'
          from pathlib import Path
          src = Path('/tmp/OM30-WhatsApp-GLPI.original.user.js')
          out = Path('OM30-WhatsApp-GLPI.user.js')
          text = src.read_text(encoding='utf-8')
          lines = [ln for ln in text.splitlines() if not ln.startswith('// @updateURL') and not ln.startswith('// @downloadURL')]
          url = 'https://raw.githubusercontent.com/pdrjsampaio/om30-userscripts/main/OM30-WhatsApp-GLPI.user.js'
          for i, line in enumerate(lines):
              if line.startswith('// @version'):
                  lines[i+1:i+1] = [
                      f'// @updateURL    {url}',
                      f'// @downloadURL  {url}',
                  ]
                  break
          else:
              raise SystemExit('Cabeçalho @version não encontrado')
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          node --check OM30-WhatsApp-GLPI.user.js

          python3 - <<'PY'
          from pathlib import Path
          p = Path('OM30-WhatsApp-GLPI.user.js')
          text = p.read_text(encoding='utf-8')
          assert '// @version      0.9.6' in text
          assert '// @updateURL    https://raw.githubusercontent.com/pdrjsampaio/om30-userscripts/main/OM30-WhatsApp-GLPI.user.js' in text
          assert '// @downloadURL  https://raw.githubusercontent.com/pdrjsampaio/om30-userscripts/main/OM30-WhatsApp-GLPI.user.js' in text
          assert 'INTEGRAÇÃO GLPI - CRIAÇÃO DIRETA DE CHAMADOS' in text
          assert len(text.splitlines()) > 13000
          print('OK:', len(text.splitlines()), 'linhas')
          PY

      - name: Simplificar estrutura antiga do loader
        shell: bash
        run: |
          rm -f om30-scripts/whatsapp-glpi/app.part*.b64
          rm -f om30-scripts/whatsapp-glpi/manifest.json
          cat > om30-scripts/whatsapp-glpi/README.md <<'EOF'
          # OM30 - WhatsApp → GLPI

          O arquivo oficial é `/OM30-WhatsApp-GLPI.user.js`.

          Ele contém o código completo do sistema e usa a atualização nativa do Tampermonkey por `@updateURL` e `@downloadURL`.

          Para publicar uma nova versão, altere o código completo, aumente `@version` e substitua o mesmo arquivo na raiz do repositório.
          EOF

      - name: Commitar restauração
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add OM30-WhatsApp-GLPI.user.js om30-scripts/whatsapp-glpi/README.md
          git add -u om30-scripts/whatsapp-glpi
          if git diff --cached --quiet; then
            echo 'Nada para alterar.'
            exit 0
          fi
          git commit -m 'Restaura WhatsApp GLPI completo com atualização nativa'
          git push
