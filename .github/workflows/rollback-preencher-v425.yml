name: Rollback Preencher v425

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rollback-preencher-v425.yml

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable reader
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/rollback425.py
          python3 /tmp/rollback425.py
          node --check OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.25$' OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.25$' OM30-Preencher-Profissional.meta.js
          if grep -q 'extrairFichaAchatada' OM30-Preencher-Profissional.user.js; then exit 1; fi
      - name: Publish rollback
        shell: bash
        run: |
          rm -f .github/workflows/rollback-preencher-v425.yml
          git config user.name 'OM30 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Preencher Profissional v4.25 rollback stable reader' || exit 0
          git push
