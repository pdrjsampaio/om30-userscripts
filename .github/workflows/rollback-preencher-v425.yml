name: Rollback Preencher v425

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rollback-preencher-v425.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar leitor estável da v4.17
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('OM30-Preencher-Profissional.user.js')
          s = p.read_text(encoding='utf-8')

          start = s.index('  /* ---------- pdf.js worker (estável, carregado uma vez) ---------- */')
          end = s.index('  /* ---------- AcroForm -> dados ---------- */', start)

          stable = r'''  /* ---------- pdf.js worker (dribla CSP) ---------- */
  async function prepararWorker() {
    if (typeof pdfjsLib === 'undefined')
      throw new Error('pdf.js NÃO carregou (a página pode bloquear o @require). Me avise.');
    const w = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    try {
      const code = await new Promise((res, rej) => GM_xmlhttpRequest({ method:'GET', url:w,
        onload:r=>res(r.responseText), onerror:rej, ontimeout:rej, timeout:20000 }));
      pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
    } catch (e) { pdfjsLib.GlobalWorkerOptions.workerSrc = w; }
  }

  /* ---------- lê os CAMPOS do AcroForm + caixas marcadas ---------- */
  async function lerFormulario(file) {
    await prepararWorker();
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    const campos = {}, marcados = []; let teveWidget = false;
    for (let p = 1; p <= pdf.numPages; p++) {
      const page = await pdf.getPage(p);
      const anns = await page.getAnnotations();
      const tc = await page.getTextContent();
      const textos = tc.items.map(it => ({ s: it.str, x: it.transform[4], y: it.transform[5] }));
      anns.filter(a => a.subtype === 'Widget').forEach(a => {
        teveWidget = true;
        const nome = (a.fieldName || '').trim();
        if (a.fieldType === 'Tx' || a.fieldType === 'Ch') {
          if (a.fieldValue != null && a.fieldValue !== '') campos[nome] = String(a.fieldValue).trim();
        } else if (a.fieldType === 'Btn') {
          const fv = a.fieldValue, on = fv && fv !== 'Off' && (a.buttonValue === fv || a.exportValue === fv || a.checkBox);
          if (on) marcados.push({ label: rotuloMaisProximo(a.rect, textos) });
        }
      });
    }
    if (!teveWidget) throw new Error('Este PDF não é um formulário preenchível (AcroForm).');
    return { campos, marcados };
  }
  function rotuloMaisProximo(rect, textos) {
    const cy = (rect[1] + rect[3]) / 2, x2 = rect[2]; let melhor = null, dist = 1e9;
    textos.forEach(t => { if (!t.s.trim()) return; if (Math.abs(t.y - cy) > 7) return;
      const dx = t.x - x2; if (dx < -3) return; if (dx < dist) { dist = dx; melhor = t.s.trim(); } });
    return melhor || '';
  }

'''

          s = s[:start] + stable + s[end:]
          s = s.replace('// @version      4.24', '// @version      4.25', 1)
          s = s.replace('// @description  Lê a Ficha de Cadastro (AcroForm ou PDF assinado/achatado), preenche o profissional, deduz órgão de classe pelo CBO e consulta CNS/CNES pelo CPF.',
                        '// @description  Lê a Ficha de Cadastro (PDF AcroForm), preenche o profissional, deduz órgão de classe pelo CBO e consulta CNS/CNES pelo CPF.', 1)
          s = s.replace('Ficha PDF · CNES · v4.24', 'Ficha PDF · CNES · v4.25')
          p.write_text(s, encoding='utf-8')

          meta = Path('OM30-Preencher-Profissional.meta.js')
          ms = meta.read_text(encoding='utf-8')
          ms = ms.replace('// @version      4.24', '// @version      4.25', 1)
          meta.write_text(ms, encoding='utf-8')
          PY

          node --check OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.25$' OM30-Preencher-Profissional.user.js
          grep -q 'pdf.js worker (dribla CSP)' OM30-Preencher-Profissional.user.js
          ! grep -q 'fallback para ficha ASSINADA/ACHATADA' OM30-Preencher-Profissional.user.js
          ! grep -q 'extrairFichaAchatada' OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.25$' OM30-Preencher-Profissional.meta.js

      - name: Publicar rollback
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rollback-preencher-v425.yml
          git config user.name 'OM30 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Preencher Profissional v4.25: rollback para leitor estável v4.17' || exit 0
          git push
