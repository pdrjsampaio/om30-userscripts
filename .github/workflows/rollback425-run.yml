name: rollback425-run

on:
  push:
    paths:
      - '.github/workflows/rollback425-run.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply rollback
        run: python3 .github/scripts/rollback_preencher_v425.py
      - name: Validate
        run: |
          node --check OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.25$' OM30-Preencher-Profissional.user.js
          grep -q '^// @version      4.25$' OM30-Preencher-Profissional.meta.js
          if grep -q 'extrairFichaAchatada' OM30-Preencher-Profissional.user.js; then exit 1; fi
      - name: Publish
        run: |
          rm -f .github/workflows/rollback-preencher-v425.yml .github/workflows/rollback425-run.yml .github/scripts/rollback_preencher_v425.py
          git config user.name 'OM30 Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Preencher Profissional v4.25 rollback stable reader' || exit 0
          git push
